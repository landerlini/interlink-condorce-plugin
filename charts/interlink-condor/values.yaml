htcondor:
  image:
    repository: "ghcr.io/landerlini/interlink-condorce-plugin/interlink-nats-condor"
    tag: "dev"
    pullPolicy: "Always"
  host: "htcondor-overlay-cm.wp6.cloud.infn.it:9619"
  schedd: "htcondor-overlay-ce1.cloudcnaf"
  pool: "condor"
  natsServer: "nats://nats.{{ .Release.Namespace }}.svc:4222"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  debug: "false"
  refreshToken:
    image:
      repository: "ghcr.io/interlink-hq/interlink/virtual-kubelet-inttw-refresh"
      tag: "0.6.2"
      pullPolicy: "IfNotPresent"
    tokenEndpoint: "https://iam.cloud.infn.it/token"
    grantType: "authorization_code"
    audience: "https://wlcg.cern.ch/jwt/v1/any"
    resources:
      requests:
        cpu: "10m"
        memory: "100Mi"
      limits:
        cpu: "200m"
        memory: "500Mi"

oidcAuthenticator:
  image:
    repository: "ghcr.io/landerlini/interlink-condorce-plugin/interlink-nats-authenticator"
    tag: "dev"
    pullPolicy: "IfNotPresent"
  issuerUrl: "https://iam.cloud.infn.it"
  scopes:
    - "offline_access"
    - "profile"
    - "openid"
    - "wlcg"
    - "wlcg.groups"
    - "address"
    - "compute.cancel"
    - "compute.create"
    - "compute.modify"
    - "compute.read"
    - "email"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

secret:
  iamClientSecretName: iam-client   # must contain keys clientId and clientSecret 
  name: "oidc-authenticator-token"
  key: "refresh_token"

interlinkConfig: |
  # Volumes and directories configuring access to executor-local data
  [volumes]

  ### Area in the executor filesystem to be used for temporary files
  scratch_area = "$TMP_DIR"

  ### Location to cache singularity images in the executor filesystem
  apptainer_cachedir = "/tmp"

  ### Location where to look for pre-built images
  image_dir = "/tmp"

  ### Colon-separated list of directories to include in $PATH to look for executables
  additional_directories_in_path = []

  ### Time in seconds between fuse mount and job execution
  fuse_sleep_seconds = 15

  ### Unpacked CVMFS path for resolving cached images
  cvmfs_unpacked_path = "/cvmfs/unpacked.infn.it"

  # Options configuring the behavior of apptainer runtime
  [apptainer]

  ### Relative or absolute path to apptainer, singularity or other compatible replacements
  executable = "/usr/bin/singularity"

  ### Enables --fakeroot in apptainer exec/run commands
  fakeroot = false
  userns = false

  ### Enables --containall flag in apptainer exec/run commands
  containall = false

  ### Define the technique to mount fuse volumes to adopt on the host.
  fuse_mode = "container"

  ### Do not propagate umask to the container, set default 0022 umask
  no_init = false

  ### Do not bind home by default
  no_home = true

  ### Drop all privileges from root user in container
  no_privs = false

  ### Enable nVidia GPU support
  nvidia_support = true

  ### Clean the environment of the spawned container
  cleanenv = true

  ### Unsquash
  unsquash = false

  [resources]
  pods = 10