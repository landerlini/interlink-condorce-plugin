htcondor:
  image:
    repository: "ghcr.io/landerlini/interlink-condorce-plugin/interlink-nats-condor"
    tag: "dev"
    pullPolicy: "IfNotPresent"
  host: "htcondor"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  refreshToken:
    image:
      repository: "ghcr.io/interlink-hq/interlink/virtual-kubelet-inttw:0.6.2"
      tag: "latest"
      pullPolicy: "IfNotPresent"
    tokenEndpoint: "https://iam.cloud.infn.it/token"
    grantType: "authorization_code"
    audience: "users"
    resources:
      requests:
        cpu: "10m"
        memory: "100Mi"
      limits:
        cpu: "200m"
        memory: "500Mi"

oidcAuthenticator:
  image:
    repository: "ghcr.io/landerlini/interlink-condorce-plugin/interlink-nats-authenticator"
    tag: "dev"
    pullPolicy: "IfNotPresent"
  issuerUrl: "https://iam.cloud.infn.it"
  scopes:
    - "offline_access"
    - "profile"
    - "openid"
    - "wlcg"
    - "wlcg.groups"
    - "address"
    - "compute.cancel"
    - "compute.create"
    - "compute.modify"
    - "compute.read"
    - "email"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

secret:
  clientId: ""
  clientSecret: ""
  name: "oidc-authenticator-token"
  key: "refresh-token"
