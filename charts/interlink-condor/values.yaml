htcondor:
  image:
    repository: "ghcr.io/landerlini/interlink-condorce-plugin/interlink-nats-condor"
    tag: "dev"
    pullPolicy: "IfNotPresent"
  host: "htcondor"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

oidcAuthenticator:
  image:
    repository: "landerlini/interlink-virtual-node-authenticator"
    tag: "latest"
    pullPolicy: "IfNotPresent"
  issuerUrl: "https://iam.cloud.infn.it"
  clientId: ""
  clientSecret: ""
  scopes:
    - "offline_access"
    - "profile"
    - "openid"
    - "email"
    - "groups"
  secret:
    namespace: ""
    name: "oidc-authenticator-token"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
