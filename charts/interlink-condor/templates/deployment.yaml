apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-htcondor-config
type: Opaque
stringData:
  condor.cfg: |-
    {{- .Values.interlinkConfig | nindent 4 }}

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-htcondor-client
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: htcondor-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: htcondor-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: htcondor-client
    spec:
      volumes:
        - name: infn-it-token
          emptyDir: {}
        - name: htcondor-config
          secret:
            secretName: {{ .Release.Name }}-htcondor-config
            items:
              - key: condor.cfg
                path: condor.cfg

      containers:
        - name: htcondor-client
          image: {{ .Values.htcondor.image.repository | default "ghcr.io/landerlini/interlink-condorce-plugin/interlink-nats-condor" }}:{{ .Values.htcondor.image.tag | default "latest" }}
          imagePullPolicy: {{ .Values.htcondor.image.pullPolicy | default "Always" }}
          env:
            - name: CONDOR_HOST
              value: {{ .Values.htcondor.host | default "htcondor" | quote }}
            - name: BEARER_TOKEN_FILE
              value: /run/secrets/infn.it/token
            - name: _CONDOR_COLLECTOR_HOST
              value: {{ .Values.htcondor.host | default "htcondor" | quote }}
            - name: _CONDOR_SCHEDD_NAME
              value: {{ .Values.htcondor.schedd | default "htcondor" | quote }}
            - name: DEBUG
              value: {{ .Values.htcondor.debug | default "false" | quote }}
            - name: BEARER_TOKEN_PATH
              value: /run/secrets/infn.it/token
          command:
            - interlink
            - condor
            - --build-config=/etc/interlink/condor.cfg
            - {{ printf "--server=%s" (.Values.htcondor.natsServer | default (printf "nats://nats.%s.svc:4222" .Release.Namespace)) | quote }}
            - --pool={{ .Values.htcondor.pool | default "condor" }}
          ports:
            - name: condor
              containerPort: 9618
              protocol: TCP
          resources:
            requests:
              cpu: {{ .Values.htcondor.resources.requests.cpu | default "100m" | quote }}
              memory: {{ .Values.htcondor.resources.requests.memory | default "128Mi" | quote }}
            limits:
              cpu: {{ .Values.htcondor.resources.limits.cpu | default "500m" | quote }}
              memory: {{ .Values.htcondor.resources.limits.memory | default "512Mi" | quote }}
          volumeMounts:
            - name: infn-it-token
              mountPath: /run/secrets/infn.it
              readOnly: true
            - name: htcondor-config
              mountPath: /etc/interlink/condor.cfg
              subPath: condor.cfg
              readOnly: true

        - name: refresh-token
          image: {{ .Values.htcondor.refreshToken.image.repository | default "ghcr.io/interlink-hq/interlink/virtual-kubelet-inttw-refresh:0.6.2" }}:{{ .Values.htcondor.refreshToken.image.tag | default "latest" }}
          imagePullPolicy: {{ .Values.htcondor.refreshToken.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: IAM_TOKEN_ENDPOINT
              value: {{ .Values.htcondor.refreshToken.tokenEndpoint | default "https://iam.cloud.infn.it/token" | quote }}
            - name: IAM_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.iamClientSecretName | default (printf "%s-token" .Release.Name) | quote }}
                  key: clientId
            - name: IAM_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.iamClientSecretName | default (printf "%s-token" .Release.Name) | quote }}
                  key: clientSecret
            - name: IAM_GRANT_TYPE
              value: {{ .Values.htcondor.refreshToken.grantType | default "authorization_code" | quote }}
            - name: IAM_REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name | default (printf "%s-token" .Release.Name) }}
                  key: {{ .Values.secret.key | default "refresh-token" }}
            - name: IAM_VK_AUD
              value: {{ .Values.htcondor.refreshToken.audience | default "users" | quote }}
            - name: TOKEN_PATH
              value: /run/secrets/infn.it/token
          command:
            - python3
            - /opt/refresh.py
          volumeMounts:
            - name: infn-it-token
              mountPath: /run/secrets/infn.it
              readOnly: false
          resources:
            requests:
              cpu: {{ .Values.htcondor.refreshToken.resources.requests.cpu | default "10m" | quote }}
              memory: {{ .Values.htcondor.refreshToken.resources.requests.memory | default "100Mi" | quote }}
            limits:
              cpu: {{ .Values.htcondor.refreshToken.resources.limits.cpu | default "200m" | quote }}
              memory: {{ .Values.htcondor.refreshToken.resources.limits.memory | default "500Mi" | quote }}
