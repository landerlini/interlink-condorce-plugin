apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-htcondor-client
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: htcondor-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: htcondor-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: htcondor-client
    spec:
      containers:
        - name: htcondor-client
          image: {{ .Values.htcondor.image.repository | default "ghcr.io/landerlini/interlink-condorce-plugin/interlink-nats-condor" }}:{{ .Values.htcondor.image.tag | default "latest" }}
          imagePullPolicy: {{ .Values.htcondor.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: CONDOR_HOST
              value: {{ .Values.htcondor.host | default "htcondor" | quote }}
          ports:
            - name: condor
              containerPort: 9618
              protocol: TCP
          resources:
            requests:
              cpu: {{ .Values.htcondor.resources.requests.cpu | default "100m" | quote }}
              memory: {{ .Values.htcondor.resources.requests.memory | default "128Mi" | quote }}
            limits:
              cpu: {{ .Values.htcondor.resources.limits.cpu | default "500m" | quote }}
              memory: {{ .Values.htcondor.resources.limits.memory | default "512Mi" | quote }}
