name: Publish Helm charts to GHCR (OCI)

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  publish:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        chart:
          - dir: charts/interlink-all-in-one
            name: interlink-with-nats

          - dir: charts/interlink-condor
            name: interlink-condor


    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Helm registry login (GHCR)
        env:
          HELM_EXPERIMENTAL_OCI: 1
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ${{ env.REGISTRY }} \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Package chart
        working-directory: ${{ matrix.chart.dir }}
        run: |
          helm package .

      - name: Push to GHCR as OCI
        working-directory: ${{ matrix.chart.dir }}
        env:
          HELM_EXPERIMENTAL_OCI: 1
        run: |
          CHART_PKG=$(find . -name '*.tgz' | head -1)

          REPO="oci://${{ env.REGISTRY }}/${{ github.repository }}/charts/${{ matrix.chart.name }}-${{ github.ref_name }}"

          echo "Pushing $CHART_PKG to $REPO"
          helm push "$CHART_PKG" "$REPO"